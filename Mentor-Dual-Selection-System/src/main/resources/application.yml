spring:
  application:
    name: Mentor-Dual-Selection-System

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
    database-platform: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:5000}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
          socketFactory:
            port: ${SPRING_MAIL_PORT:25}
            class: ${SPRING_MAIL_SOCKET_FACTORY_CLASS:javax.net.ssl.SSLSocketFactory}
            fallback: ${SPRING_MAIL_SOCKET_FACTORY_FALLBACK:false}

server:
  port: ${SERVER_PORT:50000}

springdoc:
  swagger-ui:
    enabled: ${APP_ENABLE_API_DOCS:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: ${APP_ENABLE_API_DOCS:false}
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: mentordualselectionsystem.controller
knife4j:
  enable: ${APP_ENABLE_API_DOCS:false}
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Copyright © 2023-2024 Yongxin County Lovelumine Technology Co., Ltd.
debug: ${APP_DEBUG:false}

app:
  mail:
    from: ${APP_MAIL_FROM:no-reply@example.com}
  security:
    default-initial-password: ${APP_DEFAULT_INITIAL_PASSWORD:}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,https://select.lumoxuan.cn}
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:mentor-dual-selection-system}
