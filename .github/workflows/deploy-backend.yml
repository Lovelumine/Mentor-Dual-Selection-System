name: Deploy Application

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Mentor-Dual-Selection-System/**"
      - "Mentor-Dual-Selection-System-Frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Mentor-Dual-Selection-System-Frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: Mentor-Dual-Selection-System-Frontend/pnpm-lock.yaml

      - name: Validate deploy secrets
        id: validate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_FRONTEND_DIR: ${{ secrets.DEPLOY_FRONTEND_DIR }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          APP_MAIL_FROM: ${{ secrets.APP_MAIL_FROM }}
          APP_DEFAULT_INITIAL_PASSWORD: ${{ secrets.APP_DEFAULT_INITIAL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIO_URL: ${{ secrets.MINIO_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
        run: |
          set -eu
          missing=0
          for var in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_SSH_KEY \
            DEPLOY_APP_DIR \
            SPRING_DATASOURCE_URL \
            SPRING_DATASOURCE_USERNAME \
            SPRING_DATASOURCE_PASSWORD \
            APP_DEFAULT_INITIAL_PASSWORD \
            JWT_SECRET \
            MINIO_URL \
            MINIO_ACCESS_KEY \
            MINIO_SECRET_KEY \
            MINIO_BUCKET_NAME; do
            if [ -z "${!var:-}" ]; then
              echo "::warning title=Missing deploy secret::$var is not configured."
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "frontend_dir=${DEPLOY_FRONTEND_DIR:-/www/wwwroot/select.lumoxuan.cn}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.validate.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create deployment bundle
        if: steps.validate.outputs.skip != 'true'
        run: tar czf mentor-dual-selection-system.tgz Mentor-Dual-Selection-System deploy

      - name: Install frontend dependencies
        if: steps.validate.outputs.skip != 'true'
        working-directory: Mentor-Dual-Selection-System-Frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.validate.outputs.skip != 'true'
        working-directory: Mentor-Dual-Selection-System-Frontend
        run: pnpm build

      - name: Package frontend bundle
        if: steps.validate.outputs.skip != 'true'
        run: tar czf mentor-dual-selection-frontend.tgz -C Mentor-Dual-Selection-System-Frontend/dist .

      - name: Create deploy env file
        if: steps.validate.outputs.skip != 'true'
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          APP_MAIL_FROM: ${{ secrets.APP_MAIL_FROM }}
          APP_DEFAULT_INITIAL_PASSWORD: ${{ secrets.APP_DEFAULT_INITIAL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIO_URL: ${{ secrets.MINIO_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
        run: |
          cat > mentor-dual-selection-system.env <<EOF
          SERVER_PORT=50000
          SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
          SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
          SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
          SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
          SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
          SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
          SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
          APP_MAIL_FROM=${APP_MAIL_FROM}
          APP_DEFAULT_INITIAL_PASSWORD=${APP_DEFAULT_INITIAL_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          MINIO_URL=${MINIO_URL}
          MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
          MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
          MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
          EOF

      - name: Upload deployment bundle
        if: steps.validate.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "${DEPLOY_PORT:-22}" mentor-dual-selection-system.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/mentor-dual-selection-system.tgz"
          scp -P "${DEPLOY_PORT:-22}" mentor-dual-selection-system.env "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/mentor-dual-selection-system.env"
          scp -P "${DEPLOY_PORT:-22}" mentor-dual-selection-frontend.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/mentor-dual-selection-frontend.tgz"

      - name: Deploy on server
        if: steps.validate.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_FRONTEND_DIR: ${{ steps.validate.outputs.frontend_dir }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" APP_DIR="${DEPLOY_APP_DIR}" FRONTEND_DIR="${DEPLOY_FRONTEND_DIR}" 'bash -s' <<'EOF'
          set -euo pipefail

          mkdir -p "$APP_DIR"
          tar xzf /tmp/mentor-dual-selection-system.tgz -C "$APP_DIR"
          mkdir -p "$APP_DIR/deploy"
          mv /tmp/mentor-dual-selection-system.env "$APP_DIR/deploy/.env"

          cd "$APP_DIR/deploy"
          docker compose up -d --build --remove-orphans

          mkdir -p "$FRONTEND_DIR"
          find "$FRONTEND_DIR" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +
          tar xzf /tmp/mentor-dual-selection-frontend.tgz -C "$FRONTEND_DIR"

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:50000/hello" >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS "http://127.0.0.1:50000/hello" >/dev/null
          test -f "$FRONTEND_DIR/index.html"
          EOF

      - name: Skip deployment notice
        if: steps.validate.outputs.skip == 'true'
        run: echo "Deploy skipped because required GitHub secrets are not configured."
